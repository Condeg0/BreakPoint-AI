name: MLOps Continuous Integration Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel redundant in-progress workflows to save compute
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis-and-testing:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Provision Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Enforce dependency caching to reduce build latency

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Enforce Strict Linting (Ruff)
        run: |
          # Fails pipeline on syntax errors, undefined names, or formatting violations
          ruff check src/

      - name: Execute Static Type Checking (Mypy)
        run: |
          # Fails pipeline if type hints are violated or missing in strict mode
          mypy src/ --ignore-missing-imports --strict

      - name: Run Unit Testing Suite (Pytest)
        run: |
          # Fails pipeline if any test fails. Enforces code coverage visibility.
          pytest tests/ --cov=src --cov-report=term-missing --disable-warnings
