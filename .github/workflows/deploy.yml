name: Build Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Verify Data Directory Exists
        run: |
          if [ ! -d "data/raw/" ]; then
            echo "Error: data/raw/ directory not found. Aborting build."
            exit 1
          fi
          echo "data/raw/ directory found. Proceeding with build."

      - name: Docker Build
        run: |
          docker build -t tennis-forecast .
